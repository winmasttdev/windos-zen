<?xml version="1.0" encoding="UTF-8"?>
<!--
  windOS — "Lighter Than Air" · canonical brand mark (Zen refresh)
  Minimal geometric cloud: single rounded stroke, open (unfilled) interior,
  soft cyan halo — weightlessness through air, not ink. Dark-bg first,
  cyan accent (#38bdf8). Cloud path kept from the windos.nn1kk00.ru header
  icon (viewBox 0 0 24 24) for continuity, re-tiled onto 128x128 so it
  rasterises 1:1 for Plymouth, icons, Calamares and wallpaper.

  Brand tokens
    bg            #090d16
    accent-cyan   #38bdf8   (glow rgba(56,189,248,.25))
    text          #f8fafc
    text-muted    #94a3b8
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="windOS cloud">
  <defs>
    <!-- stroke gradient: white -> ice -> cyan -->
    <linearGradient id="zenStroke" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#bae6fd"/>
      <stop offset="1"    stop-color="#38bdf8"/>
    </linearGradient>

    <!-- NOTE: filter region is oversized on purpose — this group is drawn
         inside a scale(5) transform, so stdDeviation is in *pre-scale* units
         (0.8 * 5 = 4px halo on canvas). -->
    <filter id="zenGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.8" result="b1"/>
      <feFlood flood-color="#38bdf8" flood-opacity="0.35"/>
      <feComposite in2="b1" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 24-unit cloud translated by 4 and scaled 5x -> occupies x 9..119, y ~22..103. -->
  <g transform="translate(4 4) scale(5)" filter="url(#zenGlow)">
    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"
          fill="none"
          stroke="url(#zenStroke)"
          stroke-width="2.2"
          stroke-linejoin="round"
          stroke-linecap="round"/>
  </g>
</svg>
