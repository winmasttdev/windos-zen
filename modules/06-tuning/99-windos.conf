# ============================================================================
#  windOS Zen — virtual memory & vfs tuning (Module 6)
#  /etc/sysctl.d/99-windos.conf
#  Philosophy: on a box with 1-4 GB RAM and zram swap, the kernel defaults
#  (swappiness 60, cache_pressure 100) thrash. These values keep page cache
#  warm and push anonymous memory into zstd-compressed zram early.
# ============================================================================

# Prefer keeping anonymous pages in zram over evicting page cache
vm.swappiness = 10

# Page cache is worth more than dentry/inode cache on small-RAM boxes
vm.vfs_cache_pressure = 50

# Let direct reclaim back off; kswapd should do the work
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 1500

# Laptop-mode-ish write clustering without the daemon
vm.laptop_mode = 0
vm.dirty_writeback_centisecs = 500

# Overcommit: heuristic. Browser tabs ask for more than they use.
vm.overcommit_memory = 0
vm.overcommit_ratio = 80

# Min free memory so IRQ context never deadlocks (scaled: ~16 MB)
vm.min_free_kbytes = 16384

# Huge pages: madvise only (transparent hugepages on = latency spikes)
vm.compact_unevictable_allowed = 0

# Network: small buffers, big latency win on legacy NICs
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.ipv4.tcp_rmem = 4096 87380 2097152
net.ipv4.tcp_wmem = 4096 65536 1048576
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_congestion_control = bbr

# Filesystem: atime is a disk wakeup nobody asked for
# (also enforced per-fstab with noatime)
