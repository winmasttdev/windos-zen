# MiniBoot site defaults (Debian port). Baked into the image by the
# initramfs-tools hook; kernel cmdline miniboot.root=/timeout=/default=/
# kextra=/esp= knobs override these at boot, same as upstream.
# Empty MINIBOOT_ROOT_UUID = auto-detect host / UUID at install/refresh time.
MINIBOOT_ROOT_UUID=""
MINIBOOT_SUBDIR="opt/miniboot-root"
MINIBOOT_TIMEOUT="10"
MINIBOOT_DEFAULT="1"
MINIBOOT_KEXTRA=""
MINIBOOT_ESP="/boot/efi"
