# MiniBoot image config — Debian port of miniboot-switch.conf.
# Used ONLY via: mkinitramfs -d /etc/miniboot/initramfs-tools -o OUT <kver>
# MODULES=list: take exactly the `modules` file next to this (no root-device
# probing, which also fails on overlayfs/docker — use MODULES=most debug only).
MODULES=list
BUSYBOX=y
KEYMAP=n
COMPRESS=gzip
