# ===========================================================================
#  windOS Zen — machineid config (Module 4)
#  /etc/calamares/modules/machineid.conf
#
#  Every key of the machineid job defaults to FALSE
#  (MachineIdJob::setConfigurationMap: getBool(map, "systemd", false),
#  getBool(map, "dbus", false), ...). So the module "succeeds" while doing
#  absolutely nothing, and every machine installed from this ISO would keep
#  the LIVE IMAGE's /etc/machine-id, /var/lib/dbus/machine-id and entropy
#  seeds — i.e. one shared identity cloned onto every drive. systemd treats
#  a duplicate machine-id as a hard error (journald refuses to start, DHCP
#  client IDs collide).
# ===========================================================================
---
# Fresh random UUID for /etc/machine-id in the target.
systemd: true
systemd-style: uuid

# /var/lib/dbus/machine-id becomes a symlink to /etc/machine-id, so there is
# exactly one identity in the installed system.
dbus: true
dbus-symlink: true

# Do NOT copy the live session's random-seed: generate the target's own
# (entropy-copy only copies whatever /dev/urandom already gave the host).
entropy-copy: false
entropy-files:
    - /var/lib/urandom/random-seed
    - /var/lib/systemd/random-seed