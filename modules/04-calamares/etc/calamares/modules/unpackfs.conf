# ===========================================================================
#  windOS Zen — unpackfs config (Module 4)
#  /etc/calamares/modules/unpackfs.conf
#
#  Calamares 3.3's unpackfs REQUIRES the `unpack:` list (source, sourcefs,
#  destination per entry); with no config file the job aborts and no system
#  is ever copied. calamares-settings-debian is NOT installed in this image,
#  so we ship our own. Source is the live-build squashfs as mounted by
#  live-boot at /run/live/medium.
# ===========================================================================
---
unpack:
    - source: "/run/live/medium/live/filesystem.squashfs"
      sourcefs: "squashfs"
      destination: "/"
