---
# windOS Zen — packagechooser@de (Module 4)
# Upstream Calamares packagechooser schema: mode/method/labels/default/items.
# Instance id is `de`, so the choice lands in GS key `packagechooser_de`,
# which windos-de-setup.sh (via shellprocess@windos-de) consumes.
# NOTE: every item uses `packages: []` on purpose. There are no
# windos-edition-* debs; the dispatcher installs the edition from
# packages-<id>.list. Listing phantom packages here would make the
# legacy-method exec step fail in apt.
mode: required
method: legacy

labels:
    step: "Desktop Edition"

default: gnome

items:
    - id: gnome
      packages: []
      name: "windOS Modern GNOME (Glassmorphic, Default)"
      description: "GNOME Shell with Dash to Dock, Blur my Shell, AppIndicator and User Themes, plus the windOS dconf profile (dark Arc, cyan accent). Heaviest option: ~900 MB."
      screenshot: "windos-banner.png"

    - id: fluxbox
      packages: []
      name: "Fluxbox Edition (Ultra-Light)"
      description: "windos-zen fluxbox style, picom, nitrogen wallpaper, conky HUD. Idles under 200 MB. Already on the live medium; the dispatcher applies it post-install."
      screenshot: "windos-banner.png"

    - id: xfce
      packages: []
      name: "XFCE4 Edition (Modernized Light)"
      description: "XFCE with Arc-Dark + Papirus, whisker menu, compositor on. ~350 MB idle. The sane middle."
      screenshot: "windos-banner.png"

    - id: kde
      packages: []
      name: "KDE Plasma Edition (Sleek, No Telemetry)"
      description: "Plasma with dark Breeze-derived palette, KWin blur limited to panels, background sync/telemetry masked. ~600 MB idle."
      screenshot: "windos-banner.png"

    - id: lxqt
      packages: []
      name: "LXQt Edition (Potato-Class Qt)"
      description: "Pure Qt, OpenBox WM, no compositor by default. ~220 MB idle."
      screenshot: "windos-banner.png"

    - id: tiling
      packages: []
      name: "Tiling / Minimalist Extras"
      description: "Openbox, i3-wm and Sway with windOS dotfile skeletons. For people who think mouse clicks are a latency problem."
      screenshot: "windos-banner.png"
