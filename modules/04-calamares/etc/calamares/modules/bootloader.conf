# ===========================================================================
#  windOS Zen — bootloader module config (Module 4)
#  /etc/calamares/modules/bootloader.conf
#
#  Added 2026-10-13 with the `bootloader` entry in settings.conf. Autopsy of
#  the build-15 test install: no MBR boot code, no /boot/grub, no grub.cfg,
#  grub-install and the entire /usr/lib/grub/<platform>/ tree absent from the
#  installed root. Both halves of that are now fixed (this file + the
#  `bootloader` sequence entry + config/package-lists/08-bootloader.list.chroot).
#
#  Every key below is MANDATORY. bootloader.schema.yaml is
#  `additionalProperties: false`, and main.py indexes these directly with no
#  fallback: a missing one is a KeyError, and a missing `efiBootLoader` on a
#  BIOS box leaves the local variable unbound, which is a NameError. That is
#  why this file exists at all rather than relying on distro defaults.
#
#  WHAT THE MODULE ACTUALLY RUNS (all chrooted into the installed target)
#    BIOS : grub-install --target=i386-pc --recheck --force <installPath>
#           update-grub -o /boot/grub/grub.cfg
#    UEFI : grub-install --target=x86_64-efi --efi-directory=<esp> \
#                         --bootloader-id=windOS-Zen --force
#           copy <esp>/EFI/windOS-Zen/grubx64.efi -> <esp>/EFI/BOOT/bootx64.efi
#           update-grub -o /boot/grub/grub.cfg
#
#  Firmware selection is NOT configured here, on purpose. main.py reads
#  globalstorage `firmwareType`, which the `partition` module publishes from
#  the firmware the LIVE session booted under, and branches on it. Pinning
#  efiSystemPartition or a target in this file would force the wrong branch on
#  half the machines, which is the other classic way this install ships
#  bootloaderless. Leave it alone.
# ===========================================================================
---

# --- which loader, for firmware the module supports -------------------------
# "grub" | "systemd-boot" | "refind" | "clr-boot-manager" | "sb-shim" | "none"
efiBootLoader: grub

# --- programs, resolved INSIDE the installed target -------------------------
# Absolute paths on purpose: check_target_env_call() execs these through the
# chroot, where PATH is not guaranteed to include /usr/sbin.
grubInstall: /usr/sbin/grub-install
grubMkconfig: /usr/sbin/update-grub
grubProbe: /usr/sbin/grub-probe

# --- where the generated config lands ---------------------------------------
# update-grub writes here after grub-install has laid down the platform code.
# Correct for both branches above: on BIOS grub reads it from /boot/grub, and
# on UEFI the ESP stub's $prefix resolves to the same file when /boot lives on
# the root filesystem (the layout Calamares' partition module offers by
# default). It also resolves correctly when the user picks a separate /boot,
# because Calamares keeps every target partition mounted for the whole exec
# phase.
grubCfg: /boot/grub/grub.cfg

# --- EFI NVRAM entry --------------------------------------------------------
# The label written into the firmware's boot menu. Matches
# branding.desc: bootloaderEntryName, so the entry, the EFI directory name and
# the fallback file all agree. Read by efi_boot_next() and install_secureboot().
efiBootMgr: /usr/bin/efibootmgr
efiBootloaderId: windOS-Zen

# Also copy grubx64.efi to EFI/BOOT/bootx64.efi, for UEFI firmware that
# ignores NVRAM entries. Cheap insurance on odd OEM firmware.
installEFIFallback: true