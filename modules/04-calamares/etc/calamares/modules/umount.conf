# ===========================================================================
#  windOS Zen — umount config (Module 4)
#  /etc/calamares/modules/umount.conf
#
#  JobQueue skips every non-emergency job once one has failed
#  (libcalamares/JobQueue.cpp: "Skipping non-emergency job"), and Module::setConfigurationMap
#  only sets the flag when the config file actually carries `emergency: true`.
#  Without this file the LAST job in our exec sequence silently does not run
#  after any earlier failure, leaving the new root filesystem, /boot/efi and
#  any swap mounted under the installer's temp root — the exact state in
#  which "just reboot" loses data.
# ===========================================================================
---
emergency: true