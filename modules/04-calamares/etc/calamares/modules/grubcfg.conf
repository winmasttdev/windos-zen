# ===========================================================================
#  windOS Zen — grubcfg module config (Module 4)
#  /etc/calamares/modules/grubcfg.conf
#
#  Added 2026-10-13 together with the `grubcfg` entry in settings.conf.
#  grubcfg is what writes /etc/default/grub in the installed target BEFORE
#  `bootloader` runs. Without it there is no /etc/default/grub at all in the
#  rootfs and update-grub falls back to its built-in defaults; with it the
#  menu carries windOS branding and windOS' own timeout.
#
#  Upstream (grubcfg.schema.yaml) is `additionalProperties: false`, and
#  `defaults` REQUIRES GRUB_TIMEOUT and GRUB_DEFAULT — both are set below.
# ===========================================================================
---

# Merge into whatever /etc/default/grub the target already has rather than
# clobbering it. Preserves anything a user or another tool put there.
overwrite: false

# Let GRUB_DISTRIBUTOR come from branding.desc (bootloaderEntryName:
# windOS-Zen) instead of being pinned by an existing config. This is the line
# that decides whether the menu reads "windOS Zen GNU/Linux" or "Debian
# GNU/Linux".
keep_distributor: false

# Prefer grub.d snippets over writing /etc/default/grub directly.
prefer_grub_d: false

# Apply `defaults` even when /etc/default/grub already exists. Keep false:
# true would stomp the live-session values on re-install.
always_use_defaults: false

# Kernel command line extras for the INSTALLED system.
# Explicitly empty, NOT the module's built-in default of ["quiet"].
# Reason: 00-minimal.list.chroot records the owner's decision to drop plymouth
# for a verbose boot ("owner decision: verbose boot, no splash"), so shipping
# "quiet" here would undo it on every install. grubcfg appends whatever it
# needs on top of this list anyway — resume=UUID=<swap> for an unclaimed swap,
# cryptdevice=/root= for LUKS, splash only if plymouth is present — so an
# empty base is correct, not a gap.
kernel_params: []

# The keys written into /etc/default/grub. This is also what grub-mkconfig
# consumes when `bootloader` runs update-grub afterwards.
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: 0
    # windOS backdrop instead of desktop-base's Debian swirl: grub-mkconfig
    # (05_debian_theme) honors an explicit GRUB_BACKGROUND over its default.
    GRUB_BACKGROUND: /usr/share/wallpapers/windos-zen-1920x1080.png
    # Full windOS GRUB theme (Module 8): theme files ship in
    # /usr/share/grub/themes/windos-zen/ (staged via includes.chroot).
    # 00_header turns this into set theme + gfxmenu + loadfont.
    GRUB_THEME: /usr/share/grub/themes/windos-zen/theme.txt
    # Keep the submenu: this image intentionally carries two kernels
    # (liquorix 7.2 and stock 6.12), and a booted-but-wrong-kernel install is
    # only recoverable if the other one is selectable from the menu.
    GRUB_DISABLE_SUBMENU: false
    # No GRUB_DISABLE_RECOVERY: the recovery entry is the way back from a
    # kernel that does not come up, which is the whole reason this config
    # file exists now.
    GRUB_DISABLE_RECOVERY: false