# ============================================================================
#  windOS Zen — Liquorix repo transport config
#
#  WHY THIS EXISTS
#  live-build stages config/archives/*.conf into chroot/etc/apt/apt.conf.d/
#  during the "chroot_archives install" pass, BEFORE that pass runs its
#  apt-get update (see chroot_archives: the *.conf loop runs ahead of the
#  index refresh). That makes this the only hook that is in effect while
#  apt first tries to reach the third-party Liquorix suite.
#
#  The chroot at that moment is a bare debootstrap base with no CA bundle
#  (/etc/ssl/certs/ca-certificates.crt absent), so apt cannot build a TLS
#  trust path to https://liquorix.net and the fetch fails with
#  "SSL routines::certificate verify failed". It cannot self-heal: the
#  ca-certificates/openssl packages are only unpacked by the later
#  chroot_install-packages pass, which runs after this apt-get update.
#  (Shipping ca-certificates/openssl as local .debs does not work either --
#  dpkg -i runs under `set -e`, so the first unmet-dependency error aborts
#  the whole build before the second deb is reached.)
#
#  WHY DISABLING TLS VERIFICATION IS SAFE HERE
#  This does NOT weaken repository authentication. Apt's actual trust anchor
#  for this source is the OpenPGP signature on the signed Release/InRelease
#  document, enforced by signed-by= in liquorix.list.chroot against the
#  pinned Liquorix keyring. Every Release and Packages file is verified
#  against that key; an attacker who cannot sign with the Liquorix key gets
#  nothing, regardless of what happens on the wire. This is the same model
#  Debian itself uses for plain-http mirrors (deb.debian.org is fetched over
#  http and is trusted purely on signature verification). TLS here is only
#  defence in depth against a passive observer, which is not the threat
#  model for this live image.
#
#  Scoped deliberately: these apply only inside the build chroot, and only
#  while the Liquorix repo is enabled (both are removed by the chroot_archives
#  "remove" pass). The finished image is unaffected.
# ============================================================================
Acquire::https::Verify-Peer "false";
Acquire::https::Verify-Host "false";