! ===========================================================================
!  windOS Zen — Fluxbox style
!  "Lighter Than Air" dark Fluent-ish: #090d16 surfaces, #38bdf8 hilites,
!  6px rounded top corners, zero pixmap files (pure gradients = 0 kB theme).
!  Install: ~/.fluxbox/styles/windos-zen/theme.cfg  (or /usr/share/fluxbox/styles/)
! ===========================================================================
style.name:     windos-zen
style.author:   windOS Team <https://windos.nn1kk00.ru>
style.date:     2026-09-25
style.credits:  cloud mark from windos.nn1kk00.ru, lost-media reconstruction

! ------------------------------------------------------------------ fonts --
style.font:          Plus Jakarta Sans-9
window.font:         Plus Jakarta Sans-9:bold
menu.title.font:     Plus Jakarta Sans-10:bold
toolbar.clock.font:  Plus Jakarta Sans-9:bold
toolbar.iconbar.font:Plus Jakarta Sans-9
toolbar.workspace.font: Plus Jakarta Sans-9:bold

! ----------------------------------------------------------------- window --
window.bevelWidth:          0
window.borderWidth:         1
window.borderColor:         #1e293b
window.justify:             left
window.title.height:        26
window.roundCorners:        topleft topright

window.label.focus:         gradient vertical
window.label.focus.color:   #121826
window.label.focus.colorTo: #0b1120
window.label.focus.textColor: #f8fafc

window.label.unfocus:       parentrelative
window.label.unfocus.textColor: #64748b

window.title.focus:         gradient vertical
window.title.focus.color:   #121826
window.title.focus.colorTo: #0b1120
window.title.unfocus:       parentrelative

window.button.focus:        parentrelative
window.button.unfocus:      parentrelative
window.button.focus.picColor:   #94a3b8
window.button.unfocus.picColor: #475569
window.button.focus.pressed.picColor: #38bdf8

window.handle.focus:        flat solid
window.handle.focus.color:  #0b1120
window.handle.unfocus:      flat solid
window.handle.unfocus.color:#0b1120
window.handleWidth:         4

window.grip.focus:          flat solid
window.grip.focus.color:    #38bdf8
window.grip.unfocus:        flat solid
window.grip.unfocus.color:  #1e293b

window.frame.focusColor:    #38bdf8
window.frame.unfocusColor:  #1e293b

! selected window gets a cyan hairline instead of a loud border
window.focus.borderColor:   #38bdf8
window.unfocus.borderColor: #1e293b

! ------------------------------------------------------------------- menu --
menu.bevelWidth:            6
menu.borderWidth:           1
menu.borderColor:           #1e293b
menu.itemHeight:            24
menu.titleHeight:           28
menu.roundCorners:          topleft topright bottomleft bottomright
menu.overlap:               -2

menu.title:                 gradient vertical
menu.title.color:           #121826
menu.title.colorTo:         #0b1120
menu.title.textColor:       #38bdf8
menu.title.justify:         left

menu.frame:                 flat solid
menu.frame.color:           #0d1322
menu.frame.textColor:       #cbd5e1
menu.frame.disableColor:    #475569

menu.hilite:                flat solid
menu.hilite.color:          #38bdf8
menu.hilite.textColor:      #04121c

menu.bullet:                triangle
menu.bullet.position:       right
menu.bullet.pixmap:
menu.selected.pixmap:
menu.unselected.pixmap:

menu.separator.color:       #1e293b
menu.separator.width:       1

! ---------------------------------------------------------------- toolbar --
toolbar.bevelWidth:         0
toolbar.borderWidth:        1
toolbar.borderColor:        #1e293b
toolbar.height:             30
toolbar.justify:            left
toolbar.roundCorners:       topleft topright bottomleft bottomright

toolbar:                    flat gradient vertical
toolbar.color:              #0d1322
toolbar.colorTo:            #090d16

toolbar.clock:              parentrelative
toolbar.clock.textColor:    #94a3b8
toolbar.iconbar:            parentrelative
toolbar.iconbar.focused:    gradient vertical
toolbar.iconbar.focused.color:   #16233c
toolbar.iconbar.focused.colorTo: #101a2e
toolbar.iconbar.focused.textColor: #e0f2fe
toolbar.iconbar.unfocused:  parentrelative
toolbar.iconbar.unfocused.textColor: #64748b
toolbar.workspace:          parentrelative
toolbar.workspace.textColor:#38bdf8
toolbar.button:             parentrelative
toolbar.button.picColor:    #64748b
toolbar.button.pressed.picColor: #38bdf8

! ------------------------------------------------------------------ slabs --
toolbar.appearance: flat
slit.bevelWidth:    0
slit.borderWidth:   1
slit.borderColor:   #1e293b
slit:               flat solid
slit.color:         #0d1322

! ------------------------------------------------------------------- tabs --
tab.justify:            left
tab.borderWidth:        1
tab.borderColor:        #1e293b
tab.bevelWidth:         0
tab.focused:            gradient vertical
tab.focused.color:      #16233c
tab.focused.colorTo:    #101a2e
tab.focused.textColor:  #e0f2fe
tab.unfocused:          parentrelative
tab.unfocused.textColor:#64748b

! --------------------------------------------------------------- background --
background:             flat
background.color:       #090d16
! real wallpaper is set by nitrogen at session start (see ~/.fluxbox/startup)
