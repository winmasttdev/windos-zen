# ===========================================================================
#  windOS Zen — Calamares netinstall groups (Module 4)
#  /etc/calamares/modules/netinstall-windos.conf
#  Shown AFTER the DE picker: extra groups installable on top of any edition.
# ===========================================================================
---
# groupsUrl: local = groups data lives in THIS file under `groups:`.
groupsUrl: local
required: false

groups:
  - name: "Tiling / Minimalist Extras"
    description: "For advanced users. Pick at most one — they fight over keybinds."
    packages:
      - openbox
      - i3-wm
      - sway
      - labwc
      - foot

  - name: "Gaming helpers"
    description: "No runtimes pre-installed (no bloat). Just the launchers and tools."
    packages:
      - steam-installer
      - lutris
      - gamemode
      - mangohud

  - name: "Flatpak & Distrobox ready"
    description: "Runtimes stay remote until you pull them."
    packages:
      - flatpak
      - distrobox
      - podman

  - name: "Legacy rescue kit"
    description: "For the 2009 silicon in the brochure."
    packages:
      - memtest86+
      - smartmontools
      - testdisk
      - ddrescue
