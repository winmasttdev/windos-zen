# ===========================================================================
#  windOS Zen — services-systemd config (Module 4)
#  /etc/calamares/modules/services-systemd.conf
#
#  WHY THIS FILE EXISTS: hook live/010-windos-tuning.hook.chroot masks a dozen
#  units in the LIVE image to win back RAM on a 1 GB Celeron (the comment
#  there measures 181 MB at 1 G). Those masks are /etc/systemd/system/<unit>
#  symlinks to /dev/null, so unpackfs copies them into the TARGET verbatim:
#  without this file an installed windOS Zen has no Bluetooth, no CUPS
#  (printing), no ModemManager, no mDNS/avahi and no firmware updates, with
#  no visible switch anywhere in GNOME Settings to turn them back on.
#
#  Schema (services-systemd.schema.yaml): one key `units`, a list of
#  {name, action, mandatory}. action goes straight to `systemctl <action>
#  <name>` in the target chroot, so enable/disable/mask/unmask all work
#  offline. ORDER IS THE ORDER OF OPERATIONS: unmask first, then enable,
#  then re-mask. mandatory is never set (default false), so a unit missing
#  from some edition logs a warning instead of failing the install.
#
#  Deliberately still masked on a real install (the last block): these two
#  are live-session boot-chain wins with no user-facing value on hardware.
# ===========================================================================
---
units:
    # --- step 1: lift the live-session masks --------------------------------
    - name: "bluetooth.service"
      action: "unmask"
    - name: "cups.service"
      action: "unmask"
    - name: "cups.socket"
      action: "unmask"
    - name: "cups-browsed.service"
      action: "unmask"
    - name: "avahi-daemon.service"
      action: "unmask"
    - name: "avahi-daemon.socket"
      action: "unmask"
    - name: "ModemManager.service"
      action: "unmask"
    - name: "fwupd.service"
      action: "unmask"
    - name: "fwupd-refresh.timer"
      action: "unmask"
    - name: "cron.service"
      action: "unmask"
    - name: "e2scrub_reap.service"
      action: "unmask"
    - name: "apt-daily.timer"
      action: "unmask"
    - name: "apt-daily-upgrade.timer"
      action: "unmask"

    # --- step 2: restore the upstream-enabled state ------------------------
    - name: "bluetooth.service"
      action: "enable"
    - name: "cups.service"
      action: "enable"
    - name: "cups.socket"
      action: "enable"
    - name: "cups-browsed.service"
      action: "enable"
    - name: "avahi-daemon.service"
      action: "enable"
    - name: "avahi-daemon.socket"
      action: "enable"
    - name: "ModemManager.service"
      action: "enable"
    - name: "fwupd.service"
      action: "enable"
    - name: "fwupd-refresh.timer"
      action: "enable"
    - name: "cron.service"
      action: "enable"
    - name: "e2scrub_reap.service"
      action: "enable"
    - name: "apt-daily.timer"
      action: "enable"
    - name: "apt-daily-upgrade.timer"
      action: "enable"
    # One serial console for a broken-boot rescue; tty3..tty6 stay off.
    - name: "getty@tty2.service"
      action: "enable"

    # --- step 3: keep these two off for good --------------------------------
    # NM-wait-online only exists to gate the LIVE boot on a link that is not
    # coming; on real hardware it adds boot latency for nothing.
    - name: "NetworkManager-wait-online.service"
      action: "mask"
    # GNOME Software owns offline updates on the editions that ship it.
    - name: "packagekit-offline-update.service"
      action: "mask"