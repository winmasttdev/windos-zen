# ===========================================================================
#  windOS Zen — shellprocess@windos-de (Module 4)
#  /etc/calamares/modules/shellprocess-de.conf
#
#  Runs modules/04-calamares/windos-de-setup.sh IN the installed target
#  (dontChroot: false) after netinstall, before luksbootkeyfile/umount.
#  Keys follow upstream Calamares shellprocess syntax (Debian 13 Trixie):
#  dontChroot/timeout/verbose top-level; script is a list of strings or
#  {command, timeout, environment, verbose} objects; a leading "-" on a
#  command ignores its exit status (make-style).
#
#  Selection plumbing: packagechooser@de stores the picked id in
#  GlobalStorage as packagechooser_de (legacy method default); Calamares
#  ${gs[..]} expansion injects it as WINDOS_EDITION (expansion also applies
#  to environment strings). Empty/unset values are ignored by the
#  dispatcher, which falls back to its state files, then default gnome.
#
#  Staging (live-build): windos-de-setup.sh -> /usr/local/bin/ in the
#  target; install-*-edition.sh + packages-*.list -> /usr/local/share/windos/.
# ===========================================================================
---
dontChroot: false
timeout: 1800
verbose: true
script:
    # Best-effort: persist the selection where the dispatcher (and later
    # debugging) can find it. In-target ${ROOT} is /, so this is the
    # target's /etc/windos-edition. Ignored on failure.
    - command: "-printf '%s' '${gs[packagechooser_de]}' > /etc/windos-edition"
      timeout: 30
    - command: "/usr/local/bin/windos-de-setup.sh"
      timeout: 1500
      environment: ["WINDOS_EDITION='${gs[packagechooser_de]}'"]
i18n:
    name: "Setting up the windOS desktop edition"
