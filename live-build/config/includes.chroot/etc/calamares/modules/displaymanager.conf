# ===========================================================================
#  windOS Zen — displaymanager config (Module 4)
#  /etc/calamares/modules/displaymanager.conf
#
#  REQUIRED. calamares-settings-debian is NOT installed in this image, and
#  the plain `calamares` package ships no modules/ directory at all (only
#  /usr/share/calamares/{branding,qml}), so without this file the exec step
#  aborts with:
#     "No display managers selected for the displaymanager module.
#      The displaymanagers list is empty or undefined in both globalstorage
#      and displaymanager.conf."
#
#  THE NAME MUST BE *gdm*, NOT *gdm3*. In Calamares 3.3 the module is Python
#  (src/modules/displaymanager/main.py) and looks its backend up by the
#  class attribute `name`, matched against the strings in this list; the
#  DMgdm class declares name = "gdm". Its schema also pins the enum:
#  [slim, sddm, lightdm, gdm, mdm, lxdm, greetd]. A "gdm3" entry therefore
#  finds zero implementation classes, is dropped as "selected but not
#  installed", and leaves the module with nothing to do.
#
#  *gdm* is nevertheless correct for us, because DMgdm.have_dm() probes the
#  Debian naming itself: /etc/gdm/custom.conf + gdm, else /etc/gdm3/daemon.conf
#  + gdm3, else /etc/gdm3/custom.conf + gdm3, matching an executable in
#  /usr/bin or /usr/sbin. Our image ships gdm3 (/usr/sbin/gdm3 and
#  /etc/gdm3/daemon.conf), so DMgdm binds to gdm3/daemon.conf and autologin
#  edits land in the right file.
#
#  defaultDesktopEnvironment is deliberately NOT set: we ship five editions
#  (gnome/fluxbox/xfce/kde/lxqt) assembled AFTER this module runs, so any
#  hardcoded DE would be wrong for four of them. Left unset, the module
#  auto-detects the installed session via find_desktop_environment().
# ===========================================================================
---
displaymanagers:
    - gdm

# Leave the gdm3 user/group/daemon scaffolding to the distro package, the
# same way upstream ships it; the module then only touches autologin and the
# default session.
basicSetup: false

# openSUSE-flavoured /etc/sysconfig/displaymanager handling. We are Debian.
sysconfigSetup: false