# ===========================================================================
#  windOS Zen — Calamares global settings (Module 4)
#  /etc/calamares/settings.conf
#  Overrides calamares-settings-debian: we insert packagechooser@de (the DE
#  picker) and netinstall (the group tree) into the sequence.
# ===========================================================================
---
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@de
  - netinstall@groups
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - packagechooser@de
  - netinstall@groups
  - shellprocess@windos-de
  - luksbootkeyfile
  - plymouthcfg
  - initramfscfg
  - initramfs
  - umount
- show:
  - finished

# branding component lives in /etc/calamares/branding/windos/
branding: windos

# do not phone home; windOS ships zero telemetry by contract
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false

# prompt before closing after a finished install
prompt-install: true

# modules search path: the `local` keyword resolves to the distro libdir
# (/usr/lib/x86_64-linux-gnu/calamares/modules on Debian multiarch), with
# settings in /etc/calamares/modules. NEVER replace this with a hardcoded
# /usr/lib/calamares/modules: that dir does not exist on Debian and
# Calamares then finds zero modules and exits before showing any window.
modules-search: [ local ]

instances:
- id:     de
  module: packagechooser
  config: packagechooser-de.conf

- id:     groups
  module: netinstall
  config: netinstall-windos.conf

- id:     windos-de
  module: shellprocess
  config: shellprocess-de.conf

# environment: Qt on a live fluxbox session
environment:
    QT_QPA_PLATFORM: xcb
