# ===========================================================================
#  windOS Zen — Calamares global settings (Module 4)
#  /etc/calamares/settings.conf
#  Overrides calamares-settings-debian: we insert packagechooser@de (the DE
#  picker) and netinstall (the group tree) into the sequence.
#
#  BOOTLOADER (fixed 2026-10-13): this file used to omit `bootloader` (and
#  its companion `grubcfg`) from the exec sequence entirely. Build 15's test
#  install therefore finished with a valid msdos partition table and a bootable
#  ext4 root, and NOT ONE BYTE of boot code: SeaBIOS found no MBR signature,
#  /boot/grub did not exist, no grub.cfg had ever been generated. The ISO
#  itself booted fine (it carries its own syslinux + grub-efi), which is
#  exactly why the defect survived testing on the live medium.
#  Both modules below must stay, in this order, after `initramfs` and before
#  `umount` — see the comments inline.
# ===========================================================================
---
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@de
  - netinstall@groups
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - packagechooser@de
  - netinstall@groups
  - shellprocess@windos-de
  - luksbootkeyfile
  - initramfscfg
  - initramfs
  # --- bootloader (restored) ------------------------------------------------
  # grubcfg: writes /etc/default/grub in the target. `bootloader` reads that
  #   file for its own update-grub run and its own source comment says so
  #   ("should already be filled out by the grubcfg job module"), so it must
  #   run first. It is also what puts GRUB_DISTRIBUTOR=windOS-Zen (from
  #   branding.desc: bootloaderEntryName) into the menu instead of "Debian".
  # bootloader: partition has already published the globalstorage keys it
  #   needs — firmwareType, bootLoader.installPath (the whole-disk device for
  #   BIOS) and efiSystemPartition (for UEFI) — so it execs
  #   grub-install --target=i386-pc (BIOS) or --target=x86_64-efi (UEFI)
  #   CHROOTED into the target, then update-grub.
  # AFTER initramfs: the kernel/initrd must exist before grub-mkconfig scans.
  # BEFORE umount: grub-install needs /boot mounted and the target writable.
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

# branding component lives in /etc/calamares/branding/windos/
branding: windos

# do not phone home; windOS ships zero telemetry by contract
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false

# prompt before closing after a finished install
prompt-install: true

# modules search path: the `local` keyword resolves to the distro libdir
# (/usr/lib/x86_64-linux-gnu/calamares/modules on Debian multiarch), with
# settings in /etc/calamares/modules. NEVER replace this with a hardcoded
# /usr/lib/calamares/modules: that dir does not exist on Debian and
# Calamares then finds zero modules and exits before showing any window.
modules-search: [ local ]

instances:
- id:     de
  module: packagechooser
  config: packagechooser-de.conf

- id:     groups
  module: netinstall
  config: netinstall-windos.conf

- id:     windos-de
  module: shellprocess
  config: shellprocess-de.conf

# environment: Qt on a live fluxbox session
environment:
    QT_QPA_PLATFORM: xcb
