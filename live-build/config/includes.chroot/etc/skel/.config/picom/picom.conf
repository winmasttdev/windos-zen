# ===========================================================================
#  windOS Zen — picom config (v10+ syntax, Debian bookworm ships picom 10.2)
#  Rules of the house: rounded corners yes, shadows no, blur NO.
#  Blur is a tax on every frame; legacy GPUs cannot afford the toll.
# ===========================================================================

# --- backend: auto picks glx when available, xrender otherwise -------------
backend = "auto";
vsync = true;

# --- rounded corners: the only effect we keep ------------------------------
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Conky'",
];

# --- shadows: off. They cost a full-screen composite per frame -------------
shadow = false;

# --- fading: 90 ms, just enough to hide window map pops --------------------
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;
fade-exclude = [
  "class_g = 'Conky'",
];

# --- opacity rules ----------------------------------------------------------
inactive-opacity = 100;
active-opacity = 100;
frame-opacity = 100;
inactive-opacity-override = false;

opacity-rule = [
  "96:class_g = 'Conky'",
  "98:class_g = 'fluxbox' && !focused",
];

# --- blur: explicitly none ---------------------------------------------------
blur: {
  method = "none";
};

# --- don't paint over these ---------------------------------------------------
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.96; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
  notification = { opacity = 0.98; fade = true; };
};

# --- misc ---------------------------------------------------------------------
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-ewmh-active-window = false;
refresh-rate = 0;
unredir-if-possible = true;   # fullscreen games bypass the compositor entirely
focus-exclude = [
  "class_g = 'Conky'",
  "class_g = 'Xscreenshot'",
];
