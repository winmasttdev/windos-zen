-- ===========================================================================
--  windOS Zen — conky: the only eyecandy allowed on the fluxbox desktop
--  Top-right HUD, ~3 MB RSS, 1 s tick, own_window so picom rounds it.
-- ===========================================================================
conky.config = {
    -- window
    own_window = true,
    own_window_type = 'override',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,

    -- geometry: top-right
    alignment = 'top_right',
    gap_x = 18,
    gap_y = 40,
    minimum_width = 240,
    maximum_width = 240,

    -- paint
    double_buffer = true,
    draw_blended = true,
    draw_borders = false,
    draw_outline = false,
    draw_shades = false,
    draw_graph_borders = false,

    -- text
    use_xft = true,
    font = 'Plus Jakarta Sans:size=9',
    xftalpha = 1,
    override_utf8_locale = true,

    -- cadence
    update_interval = 1,
    total_run_times = 0,

    -- colors (brand tokens)
    default_color = '#94a3b8',
    color1 = '#f8fafc',
    color2 = '#38bdf8',
    color3 = '#f43f5e',
};

conky.text = [[
${color2}${hr 1}${color}
${color1}${font Plus Jakarta Sans:size=11:bold}windOS Zen${font}${alignr}${color2}LIGHTER THAN AIR${color}
${color2}${hr 1}${color}
${color1}uptime${alignr}$uptime${color}
${color1}cpu${alignr}${cpu}%${color}
${cpubar 4,240}
${color1}ram${alignr}$mem / $memmax${color}
${membar 4,240}
${color1}swap${alignr}$swap / $swapmax${color}
${swapbar 4,240}
${color1}breeze${alignr}${color2}${execi 5 cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null | awk '{printf "%.0f°C", $1/1000}' || echo 'n/a'}${color}
${color1}disk /${alignr}$fs_used / ${fs_size /}${color}
${fs_bar 4,240 /}
${color2}${hr 1}${color}
${color1}top${alignr}cpu   mem${color}
${top name 1}${alignr}${top cpu 1}  ${top mem 1}
${top name 2}${alignr}${top cpu 2}  ${top mem 2}
${top name 3}${alignr}${top cpu 3}  ${top mem 3}
]];
