# vim:set ft=sh
#
# windOS Zen — mkinitcpio configuration for the LIVE initramfs.
# KEY CHANGE vs. upstream: the `plymouth` hook is inserted right after
# `udev` so the boot splash starts as early as possible and the
# embedded theme is packed into the image.

MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev plymouth memdisk archiso archiso_loop_mnt archiso_pxe_common
       archiso_pxe_http archiso_pxe_nbd archiso_pxe_nfs kms block
       filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
