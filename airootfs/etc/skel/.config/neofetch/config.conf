#=============================================================================
# neofetch — windOS Zen configuration
# Uses the hand-converted windOS cloud ASCII logo (see /usr/share/windos).
#=============================================================================

print_info() {
    info title
    info underline
    info os
    info host
    info kernel
    info uptime
    info packages
    info shell
    info wm
    info resolution
    info cpu
    info memory
    info cols
}

image_backend="ascii"
image_source="/usr/share/windos/logo-ascii.txt"
image_size="auto"
ascii_distro="windOS"

# windOS blue ramp
ascii_colors=( "6" "4" )

# crop/placement
crop_mode="normal"
crop_offset="0"
gap=4

# color of info labels
colors=( "6" "6" "4" "6" "6" "6" "4" "6" "6" "6" "6" )

bold="on"
separator=":"
backend="ascii"
