#=============================================================================
# windOS Zen — picom configuration (lightweight compositor)
# Balanced for low-spec GPUs: fading + shadows, NO expensive blur.
#=============================================================================
backend = "xrender";
vsync = true;

# Fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 3;

# Shadows (subtle)
shadow = true;
shadow-radius = 8;
shadow-offset-x = -2;
shadow-offset-y = -2;
shadow-opacity = 0.30;
shadow-color = "000000";
shadow-exclude = [ "n:e:Notification", "name = 'Notification'" ];

# Opacity
inactive-opacity = 0.95;
frame-opacity = 1.0;
inactive-opacity-override = false;

# No unredirect to keep compositing stable on weak hardware
unredir-if-possible = false;

# Exclude the lock screen / docks
wintypes:
{
    tooltip = { fade = true; shadow = false; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
};
