[LightDM]
run_directory=/run/lightdm
log-directory=/var/log/lightdm
cache-directory=/var/cache/lightdm

[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=xfce
session-wrapper=/etc/lightdm/Xsession
# Seamless live experience: boot straight into the desktop (Plymouth quits
# automatically when LightDM starts). Comment these two lines to show the
# greeter instead.
autologin-user=liveuser
autologin-user-timeout=0
autologin-session=xfce

[Greeter]
background=/usr/share/backgrounds/windos-zen/windos-light.png
theme-name=Adwaita-dark
icon-theme-name=Adwaita
