#=============================================================================
# windOS Zen — GNOME dconf preset (glassmorphic, dark, windOS blue)
# Applied by apply-gnome.sh after the GNOME edition is installed.
#=============================================================================
[org/gnome/desktop/interface]
gtk-theme='Adwaita-dark'
color-scheme='prefer-dark'
icon-theme='Adwaita'
cursor-theme='Adwaita'
font-name='Noto Sans 11'
document-font-name='Noto Sans 11'
monospace-font-name='Noto Sans Mono 11'

[org/gnome/desktop/background]
picture-uri='file:///usr/share/backgrounds/windos-zen/windos-dark.png'
picture-uri-dark='file:///usr/share/backgrounds/windos-zen/windos-dark.png'

[org/gnome/desktop/screensaver]
picture-uri='file:///usr/share/backgrounds/windos-zen/windos-dark.png'

[org/gnome/shell]
enabled-extensions=['dash-to-dock@micxgx.gmail.com', 'blur-my-shell@aunetx', 'appindicatorsupport@rgcjonas.gmail.com', 'user-theme@gnome-shell-extensions.gcampax.github.com']

[org/gnome/shell/extensions/dash-to-dock]
dock-position='BOTTOM'
transparency-mode='FIXED'
background-opacity=0.55
extend-height=true
intellihide=true

[org/gnome/shell/extensions/blur-my-shell]
blur-background=true
blur-app-switcher=true

[org/gnome/shell/extensions/user-theme]
name='Adwaita-dark'
