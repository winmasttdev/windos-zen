#
# windOS Zen — pacman configuration used during the live build.
# Mirror Server lines are embedded (no external mirrorlist required in chroot).
# Single reliable primary + serial downloads to avoid truncated-DB races.
#

[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
Color
ParallelDownloads = 1
# Bootstrap-only: the live build runs pacstrap with -G (no keyring in chroot),
# and the generated conf forces DatabaseTrustedOnly, so signed DBs would be
# rejected. Signature checking is re-enabled by the final system's own
# /etc/pacman.conf (provided by the pacman package).
SigLevel     = Never
LocalFileSigLevel = Never

[core]
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://archlinux.ip-connect.vn.ua/$repo/os/$arch

[extra]
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://archlinux.ip-connect.vn.ua/$repo/os/$arch

[multilib]
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://archlinux.ip-connect.vn.ua/$repo/os/$arch
