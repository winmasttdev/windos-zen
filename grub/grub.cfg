#=============================================================================
# windOS Zen — GRUB bootloader configuration
# Used for BOTH Legacy BIOS and UEFI (grub bootmode in profiledef.sh).
# Tokens %ARCHISO_LABEL% and %INSTALL_DIR% are substituted by mkarchiso.
#=============================================================================

set default=0
set timeout=15
set timeout_style=menu

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod chain

set font=(${root})/arch/boot/grub/font.pf2
if loadfont "${font}" ; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod all_video
    insmod gfxterm
    terminal_input console
    terminal_output gfxterm
fi

# Linux-Zen kernel paths on the ISO
set linux_zen="/arch/boot/x86_64/vmlinuz-linux-zen"
set initrd_zen="/arch/boot/x86_64/initramfs-linux-zen.img"

# Common flicker-free boot parameters
set windos_boot="console=ttyS0,115200 splash loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 rd.systemd.show_status=auto"

menuentry "windOS Zen — Live (Linux-Zen)" {
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux ${linux_zen} archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G ${windos_boot}
    initrd ${initrd_zen}
}

menuentry "windOS Zen — Live (verbose, no splash)" {
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux ${linux_zen} archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G
    initrd ${initrd_zen}
}

menuentry "windOS Zen — Run Memtest86+" {
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /arch/boot/memtest86+/memtest.bin
}

menuentry "UEFI Firmware Settings" {
    fwsetup
}
