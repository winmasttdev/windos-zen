<?xml version="1.0" encoding="UTF-8"?>
<!-- windOS Zen — default desktop wallpaper / Plymouth background master (1920x1080).
     Rendered to PNG by tools/gen-assets.sh; edit this, not the bitmaps.
     Zen refresh: single centred mark, whisper-quiet grid + orbs, one faint
     horizon line, tiny wordmark low on canvas — nothing else. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"    stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#090d16"/>
      <stop offset="1"    stop-color="#05070d"/>
    </linearGradient>

    <radialGradient id="cyanOrb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5"  stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1"    stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.022" stroke-width="1"/>
    </pattern>

    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- region oversized on purpose: the mark group carries scale(10), so
         stdDeviation is pre-scale (0.9 * 10 ≈ 9px on-canvas halo). -->
    <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.9" result="b"/>
      <feFlood flood-color="#38bdf8" flood-opacity="0.32"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="markStroke" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#bae6fd"/>
      <stop offset="1"    stop-color="#38bdf8"/>
    </linearGradient>

    <!-- the canonical windOS mark, 24u box -->
    <g id="mark24">
      <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"
            fill="none" stroke="url(#markStroke)" stroke-width="2.2"
            stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#f8fafc"/>
      <stop offset="0.62" stop-color="#e0f2fe"/>
      <stop offset="1"    stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- one soft cyan aura, top-centre — same trick as the website's .glow-orb -->
  <ellipse cx="960" cy="-60" rx="720" ry="480" fill="url(#cyanOrb)"/>

  <!-- faint wind streaks, left + right -->
  <g stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M200 340 H500"  stroke="#38bdf8" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M150 392 H410"  stroke="#38bdf8" stroke-opacity="0.13" stroke-width="2"/>
    <path d="M1420 700 H1720" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M1480 748 H1700" stroke="#38bdf8" stroke-opacity="0.10" stroke-width="2"/>
  </g>

  <!-- centred mark -->
  <g transform="translate(960 500) scale(10) translate(-12 -12)" filter="url(#softGlow)">
    <use xlink:href="#mark24"/>
  </g>

  <!-- tiny wordmark only -->
  <text x="960" y="792" text-anchor="middle" fill="url(#wordGrad)"
        font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="800"
        font-size="34" letter-spacing="-1">windOS Zen</text>
  <text x="960" y="822" text-anchor="middle" fill="#94a3b8"
        font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="500"
        font-size="12" letter-spacing="6">LIGHTER THAN AIR</text>

  <rect x="0" y="1046" width="1920" height="2" fill="url(#horizon)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
