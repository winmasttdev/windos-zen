<?xml version="1.0" encoding="UTF-8"?>
<!-- windOS Zen — Plymouth background (two-step / script theme). Deliberately flat and
     cheap to composite: no per-frame work, the cloud + spinner are drawn by the script. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0"   stop-color="#0b1120"/>
      <stop offset="0.6" stop-color="#090d16"/>
      <stop offset="1"   stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#38bdf8" stop-opacity="0.04"/>
      <stop offset="1"   stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="1"   stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="960" cy="120" rx="900" ry="560" fill="url(#orb)"/>
  <rect x="0" y="1046" width="1920" height="2" fill="url(#line)"/>
</svg>
