<?xml version="1.0" encoding="UTF-8"?>
<!-- windOS Zen — Plymouth centre lockup (cloud + wordmark), 512x300.
     Blitted as a single sprite by windos-zen.script: one image, zero per-frame cost.
     Transparent background: the script paints the gradient / bg PNG behind it.
     (Layout note: cloud centre maps to (256,68) at 6x so stroke + glow clear
     the viewport — the previous 7x lockup clipped ~5px off the cloud top.) -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="300" viewBox="0 0 512 300">
  <defs>
    <linearGradient id="mStroke" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#bae6fd"/>
      <stop offset="1"    stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#f8fafc"/>
      <stop offset="0.66" stop-color="#e0f2fe"/>
      <stop offset="1"    stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.9" result="b"/>
      <feFlood flood-color="#38bdf8" flood-opacity="0.35"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(256 68) scale(6) translate(-12 -12)" filter="url(#glow)">
    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"
          fill="none" stroke="url(#mStroke)" stroke-width="2.2"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <text x="256" y="246" text-anchor="middle" fill="url(#word)"
        font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="800"
        font-size="46" letter-spacing="-1.8">windOS Zen</text>
  <text x="256" y="280" text-anchor="middle" fill="#94a3b8"
        font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="500"
        font-size="14" letter-spacing="6">LIGHTER THAN AIR</text>
</svg>
