<?xml version="1.0" encoding="UTF-8"?>
<!-- windOS Zen — horizontal lockup (mark + wordmark). Rendered to PNG by tools/gen-assets.sh. -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="mStroke" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#bae6fd"/>
      <stop offset="1"    stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#f8fafc"/>
      <stop offset="0.66" stop-color="#e0f2fe"/>
      <stop offset="1"    stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.8" result="b"/>
      <feFlood flood-color="#38bdf8" flood-opacity="0.35"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- transparent background: Calamares/QML composites this over the window -->

  <!-- canonical mark: stroke-only cloud (see windos-cloud.svg) -->
  <g transform="translate(46 36) scale(5)" filter="url(#glow)">
    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"
          fill="none" stroke="url(#mStroke)" stroke-width="2.2"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <text x="196" y="112" fill="url(#word)"
        font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="800"
        font-size="66" letter-spacing="-2.5">windOS <tspan fill="#38bdf8">Zen</tspan></text>
  <text x="200" y="150" fill="#94a3b8"
        font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="600"
        font-size="18" letter-spacing="8.5">LIGHTER THAN AIR</text>
</svg>
