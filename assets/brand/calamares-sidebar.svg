<?xml version="1.0" encoding="UTF-8"?>
<!-- windOS Zen — Calamares installer sidebar (showSidebarImages: true, 160x520 @ ~1x). -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="160" height="520" viewBox="0 0 160 520">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0"   stop-color="#121826"/>
      <stop offset="1"   stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="glowBg" cx="0.5" cy="0.14" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#bae6fd"/>
      <stop offset="1"    stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.0" result="b"/>
      <feFlood flood-color="#38bdf8" flood-opacity="0.4"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="160" height="520" fill="url(#panel)"/>
  <rect width="160" height="520" fill="url(#glowBg)"/>
  <rect x="0" y="0" width="3" height="520" fill="#38bdf8" opacity="0.85"/>

  <!-- canonical mark: stroke-only cloud -->
  <g transform="translate(80 82) scale(3.1) translate(-12 -12)" filter="url(#soft)">
    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"
          fill="none" stroke="url(#stroke)" stroke-width="2.2"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <text x="80" y="152" text-anchor="middle" fill="#f8fafc"
        font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="800"
        font-size="21" letter-spacing="-0.5">windOS</text>
  <text x="80" y="174" text-anchor="middle" fill="#38bdf8"
        font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="600"
        font-size="13" letter-spacing="5">ZEN</text>

  <rect x="46" y="198" width="68" height="1" fill="#38bdf8" opacity="0.35"/>

  <text x="80" y="470" text-anchor="middle" fill="#94a3b8"
        font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="500"
        font-size="9" letter-spacing="2.6">LIGHTER</text>
  <text x="80" y="486" text-anchor="middle" fill="#94a3b8"
        font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="500"
        font-size="9" letter-spacing="2.6">THAN AIR</text>
</svg>
